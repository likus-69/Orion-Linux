# .github/workflows/build-aarch64.yml
# Build the Orion Linux aarch64 rootfs + ISO via the LFS-from-scratch path
# under QEMU user-mode emulation.
#
# Manual-trigger only. Same status as build-x86_64.yml — incomplete pipeline,
# kept for the v0.2+ roadmap.

name: Build aarch64 (LFS)

on:
  workflow_dispatch:
  push:
    tags: ['v0.2*', 'v0.3*']

permissions:
  contents: write

concurrency:
  group: build-aarch64-lfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build rootfs + ISO (aarch64, LFS path, QEMU-emulated)
    runs-on: ubuntu-22.04
    timeout-minutes: 2400

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/gradle \
                      /usr/share/rust /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      ~/.gradle ~/.dotnet ~/.rust
          docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version + arch
        id: meta
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "arch=aarch64" >> "$GITHUB_OUTPUT"

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            shellcheck \
            qemu-user-static \
            qemu-utils \
            ovmf \
            xorriso mtools dosfstools squashfs-tools
          df -h /

      - name: Register QEMU binfmt handlers
        run: |
          # Register binfmt so the kernel can exec aarch64 binaries via QEMU.
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          # Verify
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 | head -1

      - name: Set up Docker Buildx with QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Build Docker image (aarch64, emulated)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile.aarch64
          platforms: linux/arm64
          push: false
          load: true
          tags: orion-linux:aarch64-${{ steps.meta.outputs.version }}
          build-args: |
            ARCH=aarch64
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=aarch64
          cache-to: type=gha,mode=max,scope=aarch64
          outputs: |
            type=local,dest=out

      - name: Extract rootfs tarball from image
        run: |
          mkdir -p out
          docker create --name extract orion-linux:aarch64-${{ steps.meta.outputs.version }} || true
          docker cp extract:/out/. out/ || true
          docker rm extract || true
          ls -la out/

      - name: Build netinst ISO (cross-built on x86_64)
        if: hashFiles('out/orion-rootfs-*.tar.xz') != ''
        run: |
          sudo ./scripts/08-release-artifacts.sh iso \
            --arch ${{ steps.meta.outputs.arch }} \
            --version ${{ steps.meta.outputs.version }} \
            --rootfs "$(ls out/orion-rootfs-*.tar.xz | head -1)" \
            --out out

      - name: Build flashable .img for SBCs (aarch64 only)
        if: hashFiles('out/orion-rootfs-*.tar.xz') != ''
        run: |
          sudo ./scripts/08-release-artifacts.sh img \
            --arch ${{ steps.meta.outputs.arch }} \
            --version ${{ steps.meta.outputs.version }} \
            --rootfs "$(ls out/orion-rootfs-*.tar.xz | head -1)" \
            --out out || true

      - name: Compute checksums
        run: |
          cd out
          for f in *.iso *.img *.tar.xz *.img.zst; do
            [[ -f "$f" ]] || continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-linux-aarch64-${{ steps.meta.outputs.version }}
          path: out/*
          retention-days: 14
          if-no-files-found: warn

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: true
          name: Orion Linux ${{ steps.meta.outputs.version }}
